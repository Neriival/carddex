# Robô diário do CardDex, sozinho, todo dia:
#  1) dá um "toque" no banco (Supabase): o plano grátis pausa o projeto depois de ~7 dias sem uso
#  2) baixa as coleções "Em breve" que a TCGdex já publicou (scripts/baixar_cartas.py --em-breve)
#  3) atualiza os preços (Cardmarket → real) com scripts/atualizar_precos.py
#  4) atualiza o "fiscal" dos preços (TCGplayer → real) com scripts/atualizar_precos_tcgplayer.py
# e salva o que mudou no repositório (o GitHub Pages publica o site de novo em seguida).
# Também dá para rodar na hora: GitHub → Actions → "Atualizar preços" → Run workflow.
name: Atualizar preços

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 6h (horário de Brasília); o Cardmarket atualiza de madrugada
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manter o banco acordado (Supabase)
        # faz uma leitura pequena e pública (a lista de parceiros), com o endereço e a chave pública do js/config.js;
        # se o banco estiver fora do ar, avisa em amarelo mas não impede a atualização dos preços
        continue-on-error: true
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js | head -1)
          CHAVE=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" js/config.js | head -1)
          curl -fsS --max-time 60 "$URL/rest/v1/parceiros?select=posicao&limit=1" -H "apikey: $CHAVE" -o /dev/null
          echo "Banco respondeu."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coleções novas (as marcadas como "Em breve")
        # se a TCGdex ainda não publicou, não faz nada; se der erro, os preços são atualizados mesmo assim
        continue-on-error: true
        run: python scripts/baixar_cartas.py --em-breve
      - name: Atualizar preços
        run: python scripts/atualizar_precos.py
      - name: Preços do TCGplayer (fiscal)
        # uns 10 minutos (um acesso à TCGdex por carta); se falhar, o site usa os do dia anterior
        continue-on-error: true
        run: python scripts/atualizar_precos_tcgplayer.py
      - name: Salvar no repositório
        run: |
          git config user.name "CardDex (preços automáticos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/precos dados/precos-tcgplayer dados/cardmarket.json dados/series.json dados/cartas assets/img
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q "^dados/cartas/"; then
            MSG="Coleção nova e preços atualizados ($(date +%d/%m/%Y))"
          else
            MSG="Preços atualizados ($(date +%d/%m/%Y))"
          fi
          git commit -m "$MSG" && git pull --rebase && git push
