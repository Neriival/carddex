# Atualiza os preços das cartas pela Liga Pokémon (mercado brasileiro), sozinho, 2 vezes por dia.
# Roda scripts/atualizar_precos_liga.py e salva dados/precos-liga/ no repositório
# (o GitHub Pages publica o site de novo em seguida).
# A Liga pede 6 minutos entre acessos: cada rodada atualiza por até ~5h15 as coleções há mais tempo sem atualizar.
# Também dá para rodar na hora: GitHub → Actions → "Preços da Liga" → Run workflow.
name: Preços da Liga

on:
  schedule:
    - cron: '0 7 * * *'    # 4h (horário de Brasília)
    - cron: '0 19 * * *'   # 16h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precos-liga
  cancel-in-progress: false

jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar preços da Liga
        env:
          TEMPO_LIMITE_MIN: '315'
        run: python scripts/atualizar_precos_liga.py
      - name: Salvar no repositório
        run: |
          git config user.name "CardDex (preços automáticos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/precos-liga
          git diff --cached --quiet && exit 0
          git commit -m "Preços da Liga atualizados ($(date +%d/%m/%Y))"
          # o site pode ter mudado durante as horas de espera: junta antes de enviar
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
