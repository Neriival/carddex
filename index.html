<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CardDex – Sua coleção de cartas</title>
<link rel="icon" href="assets/img/carddex-logo.png">
<!-- app instalável (área de trabalho / celular) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00143e">
<link rel="apple-touch-icon" href="assets/img/app/icone-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css?v=20261006b">
<link rel="stylesheet" href="css/layout.css?v=20261006b">
<link rel="stylesheet" href="css/componentes/cartas.css?v=20261006b">
<link rel="stylesheet" href="css/componentes/carta-grande.css?v=20261006b">
<link rel="stylesheet" href="css/componentes/compartilhar.css?v=20261006b">
<link rel="stylesheet" href="css/componentes/parceiros.css?v=20261006b">
<link rel="stylesheet" href="css/telas/colecao.css?v=20261006b">
<link rel="stylesheet" href="css/telas/minhas.css?v=20261006b">
<link rel="stylesheet" href="css/telas/conta.css?v=20261006b">
<link rel="stylesheet" href="css/telas/ranking.css?v=20261006b">
<link rel="stylesheet" href="css/telas/colecao-de.css?v=20261006b">

<body>
<div class="pagina">
<aside class="lado" id="parc-esq" aria-label="Parceiros"></aside>
<div class="wrap">
<nav>
<img class="mark" src="assets/img/carddex-logo.png" alt="CardDex"><div class="brand">Card<b>Dex</b></div>
<div class="links"><a href="#" class="on" onclick="telaInicio();return false">Início</a><a href="#" onclick="telaInicio('series');return false">Séries</a><a href="#" onclick="telaMinhas();return false">Minhas cartas</a><a href="#" onclick="telaRanking();return false">Ranking</a><a href="#" id="nav-admin" onclick="telaAdmin();return false" hidden>Admin</a></div>
<div class="sp"></div><input class="busca" id="busca" type="search" placeholder="Buscar séries ou coleções..." aria-label="Buscar séries ou coleções" oninput="telaInicio('series')">
<button class="nav-btn" id="nav-conta" type="button" onclick="clicarConta()">Entrar</button>
</nav>
<main id="app"></main>
<section class="parceiros-faixa" id="parc-faixa" aria-label="Parceiros"></section>
</div>
<aside class="lado" id="parc-dir" aria-label="Parceiros"></aside>
</div>
<!-- janela da carta grande e da imagem de compartilhar -->
<div id="modal" class="modal" hidden></div>

<!-- banco de dados (login, contas, ranking, parceiros) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20261006b"></script>
<!-- base: ajudantes, dados das cartas, marcações e sincronização com a conta -->
<script src="js/base/util.js?v=20261006b"></script>
<script src="js/base/dados.js?v=20261006b"></script>
<script src="js/base/marcacoes.js?v=20261006b"></script>
<script src="js/base/precos.js?v=20261006b"></script>
<script src="js/base/nuvem.js?v=20261006b"></script>
<!-- conta: login, perfil e fotos -->
<script src="js/conta/auth.js?v=20261006b"></script>
<script src="js/conta/fotos.js?v=20261006b"></script>
<script src="js/conta/login.js?v=20261006b"></script>
<script src="js/conta/perfil.js?v=20261006b"></script>
<!-- recursos usados em várias telas -->
<script src="js/recursos/carta-grande.js?v=20261006b"></script>
<script src="js/recursos/compartilhar.js?v=20261006b"></script>
<script src="js/recursos/parceiros.js?v=20261006b"></script>
<script src="js/recursos/vitrine.js?v=20261006b"></script>
<!-- telas -->
<script src="js/telas/inicio.js?v=20261006b"></script>
<script src="js/telas/colecao.js?v=20261006b"></script>
<script src="js/telas/minhas.js?v=20261006b"></script>
<script src="js/telas/ranking.js?v=20261006b"></script>
<script src="js/telas/perfil-publico.js?v=20261006b"></script>
<script src="js/telas/colecao-de.js?v=20261006b"></script>
<script src="js/telas/admin.js?v=20261006b"></script>
<!-- começa o site -->
<script src="js/main.js?v=20261006b"></script>

</html>
